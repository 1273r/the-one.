name: Build THE ONE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run tests and build shaded plugin
        run: gradle clean test shadowJar
      - name: Verify plugin JAR exists
        run: test -s build/libs/the-one-paper-1.0.0.jar
      - name: Upload server-ready plugin
        uses: actions/upload-artifact@v4
        with:
          name: THE-ONE-Paper-1.21.11
          path: build/libs/the-one-paper-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
