# THE ONE — Paper 1.21.11
# All effects are server-side. A Paper plugin cannot force GPU shaders onto clients.
# Players can use Iris or another compatible client shader loader independently.

storage:
  # SQLite is stored in plugins/THE_ONE/the-one.db
  database: the-one.db

visual:
  enabled: true
  points-per-ring: 56
  base-radius: 0.95
  radius-per-ring: 0.145
  height-spacing: 0.19
  particle-size: 1.25
  rotation-speed: 0.045
  tilt-speed: 0.13
  inward-streams: true
  ring-highlights: true
  core-particles: true
  max-render-distance: 48.0
  action-bar: true
  stage-title: true
  # Safety ceiling. The engine also scales ring detail with the active stage.
  max-particles-per-tick: 900

progression:
  # Kill thresholds for each evolution. Do not change order.
  thresholds: [0, 2, 5, 10, 15, 20, 30]
  buffs:
    enabled: true
    refresh-ticks: 40
    duration-ticks: 100

audio:
  enabled: true
  progression-volume: 0.8
  ambient-volume: 0.25

messages:
  prefix: '<gradient:#f8f3ff:#55eaff><bold>THE ONE</bold></gradient> <dark_gray>»</dark_gray> '
  no-permission: '<red>You do not have permission to do that.'
  player-only: '<red>This command can only be used by a player.'
  invalid-player: '<red>That player is not online.'
  assigned: '<aqua>%player% <gray>has become <gold>THE ONE<gray>.'
  removed: '<gray>The current holder has been removed.'
  kills-set: '<gray>Progression set to <white>%kills%</white> kills.'
  reset: '<gray>Progression reset for <white>%player%</white>.'
  reloaded: '<green>Configuration reloaded.'
  effects-on: '<green>Orbital effects enabled.'
  effects-off: '<yellow>Orbital effects disabled.'
