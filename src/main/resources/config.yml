# THE ONE — Paper 1.21.11
# All effects are server-side. A Paper plugin cannot force GPU shaders onto clients.
# Players can use Iris or another compatible client shader loader independently.

storage:
  # SQLite is stored in plugins/THE_ONE/the-one.db
  database: the-one.db

visual:
  enabled: true
  points-per-ring: 56
  base-radius: 0.95
  radius-per-ring: 0.145
  height-spacing: 0.19
  particle-size: 1.25
  rotation-speed: 0.045
  tilt-speed: 0.13
  inward-streams: true
  ring-highlights: true
  core-particles: true
  action-bar: true
  stage-title: true
  # Safety ceiling. The engine also scales ring detail with the active stage.
  max-particles-per-tick: 900

progression:
  buffs:
    enabled: true
    refresh-ticks: 40
    duration-ticks: 100

audio:
  enabled: true
  progression-volume: 0.8


# One-time cinematic played when a new player is assigned as THE ONE.
# Cosmetic particles and sounds only: no explosion entity, damage, or block changes.
transition:
  enabled: true
  screen-shake: true
  # Trail particles form continuous geometry; this is a hard per-tick safety ceiling.
  max-particles-per-tick: 1600
